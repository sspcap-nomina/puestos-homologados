locale: "es"

backend:
  name: github
  repo: sspcap-nomina/puestos-homologados
  branch: main

publish_mode: editorial_workflow

media_folder: "admin/uploads"
public_folder: "/admin/uploads"

collections:
  - name: "puestos"
    label: "Puestos Homologados"
    label_singular: "Puesto"
    description: "Catálogo maestro de puestos, con el personal activo por empresa. Los puestos con 0 personas en todas las empresas quedan guardados aquí pero no se muestran en el sitio público hasta que se contrate a alguien."
    files:
      - name: "puestos"
        label: "Listado de Puestos"
        description: "Un registro por puesto único (dirección + departamento + función + puesto vigente). Las cifras de cada empresa son la cantidad de personas activas en ese puesto."
        file: "puestos.json"
        fields:
          - label: "Puestos"
            name: "puestos"
            widget: "list"
            summary: "{{departamento}} — {{puesto_vigente}} ({{encargado}} · {{funcion}})"
            fields:
              - label: "Dirección corporativa"
                name: "encargado"
                widget: "select"
                options:
                  - { label: "CIO", value: "CIO" }
                  - { label: "COO", value: "COO" }
                  - { label: "CFO", value: "CFO" }

              - label: "Departamento"
                name: "departamento"
                widget: "string"
                hint: "Si cambias el departamento de un puesto existente, se reagrupa solo en el sitio público."

              - label: "Función"
                name: "funcion"
                widget: "select"
                options:
                  - { label: "Back Office", value: "Back Office" }
                  - { label: "Middle Office", value: "Middle Office" }
                  - { label: "Front Office", value: "Front Office" }

              - label: "Puesto Vigente"
                name: "puesto_vigente"
                widget: "string"

              - label: "Personal activo por empresa"
                name: "empresas"
                widget: "object"
                hint: "Cantidad de personas activas en este puesto, por empresa. Un puesto con 0 en todas las empresas no aparece en la búsqueda pública, pero queda guardado aquí."
                fields:
                  - { label: "Perú · EILC", name: "EILC", widget: "number", valueType: "int", default: 0 }
                  - { label: "Perú · PCT", name: "PCT", widget: "number", valueType: "int", default: 0 }
                  - { label: "Bolivia · PDM", name: "PDM", widget: "number", valueType: "int", default: 0 }
                  - { label: "Nicaragua · CDF", name: "CDF", widget: "number", valueType: "int", default: 0 }
                  - { label: "Guatemala · AFG", name: "AFG", widget: "number", valueType: "int", default: 0 }
                  - { label: "Guatemala · MPG", name: "MPG", widget: "number", valueType: "int", default: 0 }
                  - { label: "Honduras · AFH", name: "AFH", widget: "number", valueType: "int", default: 0 }
                  - { label: "Honduras · MPH", name: "MPH", widget: "number", valueType: "int", default: 0 }
                  - { label: "Honduras · ECH", name: "ECH", widget: "number", valueType: "int", default: 0 }
                  - { label: "El Salvador · AFS", name: "AFS", widget: "number", valueType: "int", default: 0 }
                  - { label: "El Salvador · PST", name: "PST", widget: "number", valueType: "int", default: 0 }
                  - { label: "El Salvador · ECS", name: "ECS", widget: "number", valueType: "int", default: 0 }

              - label: "Orden general"
                name: "orden"
                widget: "number"
                required: false
                default: 0
                hint: "Controla el orden de aparición en el listado. No es necesario modificarlo manualmente."

              - label: "Orden del departamento"
                name: "departamento_orden"
                widget: "number"
                required: false
                default: 999
                hint: "Controla el orden en que se agrupan los departamentos en la tabla."
